<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WorkBookmark</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <main>
    <p class="eyebrow">WORKBOOKMARK</p>
    <h1>현재 페이지 기억하기</h1>
    <p id="page-title" class="page-title">페이지 확인 중…</p>
    <p id="page-address" class="page-address"></p>
    <button id="capture" type="button" disabled>이 페이지 저장</button>
    <p id="shortcut">단축키 확인 중…</p>
    <button id="shortcut-settings" type="button">단축키 설정 열기</button>
    <p id="status" role="status" aria-live="polite"></p>
    <details>
      <summary>저장 정보와 단축키</summary>
      <p>주소와 제목만 이 PC에 저장합니다. 주소의 검색 조건과 # 뒤 위치도 보존하므로, 주소에 포함된 공유·로그인 토큰이 함께 저장될 수 있습니다.</p>
      <p>본문, 방문 기록, 쿠키는 읽지 않습니다. 일반 http·https 페이지만 지원합니다.</p>
      <p>저장할 때 WorkBookmark가 실행 중이어야 합니다.</p>
      <p>단축키 충돌은 브라우저 확장 프로그램의 키보드 단축키 화면에서 바꿀 수 있습니다.</p>
    </details>
  </main>
</body>
</html>
